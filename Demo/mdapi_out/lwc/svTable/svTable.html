<template>
    <lightning-card title="BlazeMeter SV Data">
        <div class="slds-m-around_medium">
            <lightning-input 
                label="Enter Account ID" 
                value={accountId} 
                onchange={handleAccountIdChange}>
            </lightning-input>
        </div>

        <div class="slds-m-around_medium slds-grid slds-gutters">
            <div class="slds-col">
                <lightning-button label="Submit" onclick={handleSubmit}></lightning-button>
            </div>
            <div class="slds-col">
                <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>
            </div>
        </div>

        <template if:true={data}>
            <template if:false={isMobile}>
                <div style="overflow-x:auto;">
                    <lightning-datatable 
                        key-field="id" data={data} 
                        columns={columns} 
                        hide-checkbox-column 
                        column-widths-mode="auto">
                    </lightning-datatable>
                </div>
            </template>
        </template>

        <template if:true={data}>
            <template if:true={isMobile}>
                <template for:each={data} for:item="row">
                    <div key={row.id} class="slds-box slds-m-around_small">
                        <p><b>Account Id:</b> {row.accountId}</p>
                        <p><b>Account Name:</b> {row.accountName}</p>
                        <p><b>First Name:</b> {row.firstName}</p>
                        <p><b>Last Name:</b> {row.lastName}</p>
                        <p><b>Email:</b> {row.email}</p>
                        <p><b>Street:</b> {row.street}</p>
                        <p><b>Cost of Contract:</b> {row.contractCost}</p>
                        <p><b>UK Rate:</b> {row.poundRate}</p>
                    </div>
                </template>
            </template>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error slds-m-around_medium">{error}</p>
        </template>
    </lightning-card>
</template>
